name: Vinylsleeve
options:
  bundleIdPrefix: com.shimondeitel.vinylsleeve
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "W7Q885Q59C"
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
targets:
  Vinylsleeve:
    type: application
    platform: iOS
    sources:
      - path: Vinylsleeve
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.vinylsleeve
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Vinylsleeve/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: "YES"
        GENERATE_INFOPLIST_FILE: "NO"
  VinylsleeveTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: VinylsleeveTests
      - path: Vinylsleeve.storekit
    dependencies:
      - target: Vinylsleeve
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.vinylsleeve.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"
  VinylsleeveUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: VinylsleeveUITests
    dependencies:
      - target: Vinylsleeve
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shimondeitel.vinylsleeve.uitests
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  Vinylsleeve:
    build:
      targets:
        Vinylsleeve: all
        VinylsleeveTests: [test]
        VinylsleeveUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: Vinylsleeve.storekit
    test:
      config: Debug
      storeKitConfiguration: Vinylsleeve.storekit
      targets:
        - VinylsleeveTests
        - VinylsleeveUITests
    archive:
      config: Release
